seed: 20260903
deterministic: true
output_dir: runs/dae
data:
  synthetic: false
  tensor_file: data/processed/train_tensors.pt
model:
  variant: dae
  input_dim: 768
  hidden_dim: 384
  latent_dim: 128
  pair_feature_dim: 8
  matrix_channels: 8
training:
  device: auto
  epochs: 20
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  max_grad_norm: 1.0
  mixed_precision: true
loss:
  positive_weight: 3.0
  reconstruction_weight: 0.1
  mask_probability: 0.15
  noise_std: 0.01
